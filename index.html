<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Letter For You</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

 <!-- Muzik Latar Belakang -->
<audio id="bg-music" loop>
  <source src="Maafkanlah.mp3" type="audio/mpeg" />
</audio>

  <!-- Sampul Surat (Mula-mula) -->
  <div id="envelope-container" onclick="openLetter()">
    <div class="envelope">
      <p>FOR</p>
      <h2>My Sayang</h2>
      <span>✦ TAP TO OPEN ✦</span>
    </div>
  </div>

  <!-- Isi Surat (Tersembunyi Dahulu) -->
  <div id="letter-container" class="hidden">
    <div class="letter-box">
      <h1>Apology Letter</h1>
      <p class="date">1 Ogos 2026</p>
      <h2>Dearest Sayang</h2>
      <p id="typed-text"></p>
      <p class="signature">Your Pakcik</p>

      <!-- Progress Bar Lagu -->
      <div class="audio-player-container">
        <span id="current-time">0:00</span>
        <input type="range" id="progress-bar" value="0" min="0" step="0.1" />
        <span id="duration">0:00</span>
      </div>
      
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
